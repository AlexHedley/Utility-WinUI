name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test tests/Utility.Core.Tests/Utility.Core.Tests.csproj --configuration Release

      - name: Publish self-contained app
        run: >-
          dotnet publish src/Utility.WinUI.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/Utility-WinUI-win-x64
          -p:WindowsAppSDKSelfContained=true
          -p:WindowsPackageType=None

      - name: Package app
        run: Compress-Archive -Path artifacts/Utility-WinUI-win-x64/* -DestinationPath artifacts/Utility-WinUI-${{ inputs.tag || github.ref_name }}-win-x64.zip
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Utility-WinUI ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/Utility-WinUI-${{ inputs.tag || github.ref_name }}-win-x64.zip
          fail_on_unmatched_files: true
